[package]
name = "pg_charabia"
version = "0.3.1"
edition = "2024"
rust-version = "1.97.1"
description = "Charabia multilingual analysis for PostgreSQL text search"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
test-hooks = []

[dependencies]
pgrx = { version = "=0.19.3", default-features = false }
charabia = { version = "=0.10.0", default-features = false, features = [
    "chinese", "japanese", "korean", "thai", "vietnamese", "turkish",
    "german-segmentation", "latin-camelcase",
] }
fst = "=0.4.7"
whatlang = "=0.18.0"
unicode-normalization = "=0.1.26"
qdrant-rust-stemmers = "=1.2.2"
sha2 = "0.10"
serde = "1.0"
serde_json = "1.0"
linkify = "=0.11.0"
iri-string = { version = "=0.7.14", default-features = false }

[build-dependencies]
sha2 = "0.10"
charabia = { version = "=0.10.0", default-features = false }
stop-words = { version = "=0.10.1", default-features = false, features = ["iso", "nltk"] }
fst = "=0.4.7"
unicode-normalization = "=0.1.26"
serde_json = "1.0"

# Keep detection fast in debug workloads without disabling its checks.
[profile.dev.package.whatlang]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
