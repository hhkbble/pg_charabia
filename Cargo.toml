[package]
name = "pg_charabia"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Charabia multilingual analysis for PostgreSQL text search"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
test-hooks = []

[dependencies]
pgrx = { version = "=0.19.3", default-features = false }
charabia = { version = "=0.10.0", default-features = false, features = [
    "chinese", "hebrew", "japanese", "thai", "korean", "greek", "khmer",
    "vietnamese", "swedish-recomposition", "turkish", "german-segmentation",
] }
fst = "=0.4.7"
serde = "1.0"
serde_json = "1.0"

[build-dependencies]
sha2 = "0.10"

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
