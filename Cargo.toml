[package]
name = "pg_charabia"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Charabia multilingual analysis for PostgreSQL text search"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
test-hooks = []

[dependencies]
pgrx = { version = "=0.19.3", default-features = false }
charabia = { version = "=0.10.0", default-features = false, features = [
    "chinese", "hebrew", "japanese", "thai", "korean", "greek", "khmer",
    "vietnamese", "turkish",
] }
fst = "=0.4.7"
whatlang = "=0.18.0"
unicode-normalization = "=0.1.26"
qdrant-rust-stemmers = "=1.2.2"
stop-words = { version = "=0.10.1", default-features = false, features = ["iso", "nltk"] }
sha2 = "0.10"
serde = "1.0"
serde_json = "1.0"

[build-dependencies]
sha2 = "0.10"

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
